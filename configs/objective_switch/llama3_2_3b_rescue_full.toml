[model]
id = "meta-llama/Llama-3.2-3B"
revision = "13afe5124825b4f3751f836b40dafda64c1ed062"
label_readout = "bare_canonical_token"
labels = ["A", "B", "C", "D", "E"]
prompt_style = "historical_alpaca_class_label"

[lora]
target_modules = ["q_proj", "k_proj", "v_proj", "up_proj", "down_proj"]
rank = 32
alpha = 64
dropout = 0.05

[objective]
name = "pro_ce_convex"
beta = 0.1
prior_lambda = 0.01
temperature_mode = "auto"

[training]
paper_mode = true
num_branches = 8
branch_seeds = [42, 43, 44, 45, 46, 47, 48, 49]
epochs = 2
batch_size = 16
micro_batch_size = 8
learning_rate = 0.0001
warmup_steps = 100
dtype = "bf16"
max_length = 256
shuffle_seed = 42
gradient_checkpointing = false
